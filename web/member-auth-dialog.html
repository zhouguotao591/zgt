<dialog id="member-auth-dialog" class="strategy-dialog member-auth-dialog" aria-labelledby="member-auth-title"><div class="strategy-dialog-head"><h2 id="member-auth-title">会员登录</h2><button class="secondary dialog-close" id="member-auth-close" type="button" aria-label="关闭登录注册弹窗">×</button></div><div class="member-auth-content"><div class="member-auth-tabs" role="tablist" aria-label="登录注册"><button id="member-auth-login-tab" role="tab" type="button" aria-selected="true">会员登录</button><button id="member-auth-register-tab" role="tab" type="button" aria-selected="false">邀请码注册</button></div><p id="member-auth-note">登录后查看算法大厅。</p><form id="member-auth-form"><label>用户名<input id="member-auth-username" autocomplete="username" pattern="[A-Za-z0-9_]{4,32}" minlength="4" maxlength="32" required placeholder="4—32位字母、数字或下划线"></label><label>密码<input id="member-auth-password" type="password" autocomplete="current-password" minlength="10" maxlength="128" required placeholder="至少10位"></label><label id="member-auth-confirm-label" hidden>确认密码<input id="member-auth-confirm" type="password" autocomplete="new-password" minlength="10" maxlength="128"></label><label id="member-auth-invite-label" hidden>邀请码<input id="member-auth-invite" autocomplete="off" maxlength="80" placeholder="管理员提供的邀请码"></label><label>图片验证码<div class="member-captcha-row"><input id="member-auth-captcha" autocomplete="off" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" required placeholder="5位数字"><button id="member-captcha-refresh" type="button" aria-label="刷新图片验证码" title="点击换一张"><img id="member-captcha-image" alt="五位数字验证码"></button></div></label><p id="member-auth-error" role="alert"></p><button id="member-auth-submit" type="submit">登录</button></form></div></dialog>
