<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PC28 · 会员登录</title><link rel="stylesheet" href="/auth.css"><script src="/auth.js" defer></script></head><body><main class="auth-shell"><div class="auth-brand"><span>28</span><div id="auth-site">PC28</div></div><div class="auth-tabs"><a href="/login" id="auth-login-link">会员登录</a><a href="/register" id="auth-register-link">邀请码注册</a></div><h1 id="auth-title">会员登录</h1><p id="auth-note">登录后查看开奖、走势和模拟统计。</p><form id="auth-form"><label>用户名<input id="auth-username" autocomplete="username" pattern="[A-Za-z0-9_]{4,32}" minlength="4" maxlength="32" required placeholder="4—32位字母、数字或下划线"></label><label>密码<input id="auth-password" type="password" autocomplete="current-password" minlength="10" maxlength="128" required placeholder="至少10位"></label><label id="auth-confirm-label" hidden>确认密码<input id="auth-confirm" type="password" autocomplete="new-password" minlength="10" maxlength="128"></label><label id="auth-invite-label" hidden>邀请码<input id="auth-invite" autocomplete="off" maxlength="80" placeholder="请输入管理员提供的邀请码"></label><label id="auth-setup-label" hidden>本机管理员初始化码<input id="auth-setup" autocomplete="off" maxlength="100" placeholder="从本机 data/admin-setup-code.txt 复制"></label><label>图片验证码<div class="captcha-row"><input id="auth-captcha" autocomplete="off" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" required placeholder="5位数字"><button id="captcha-refresh" type="button" title="点击换一张" aria-label="刷新验证码"><img id="captcha-image" alt="五位数字验证码"></button></div></label><p id="auth-error" role="alert"></p><button id="auth-submit" type="submit">登录</button></form><p class="auth-foot">仅用于开奖分析和本地模拟</p></main></body></html>
