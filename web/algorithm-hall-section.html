<section id="algorithm-hall" class="tab"><div class="algo-heading"><div><p>本地算法 · 历史方向命中统计</p></div><span id="algo-cutoff" class="algo-cutoff">读取本地数据…</span></div><div class="algo-filters"><div class="segmented" id="algo-categories" aria-label="算法分类"><button data-axis="all" class="selected">全部</button><button data-axis="size">大小</button><button data-axis="parity">单双</button></div><label>排序方式<select id="algo-sort"><option value="rate">胜率降序</option><option value="rate100">近100期胜率</option><option value="current_hit">当前连中</option><option value="current_miss">当前连挂</option><option value="max_hit">最大连中</option><option value="max_miss">最大连挂</option><option value="favorites">收藏数</option><option value="name">名称</option></select></label><label>统计窗口<select id="algo-window"><option value="20">近20期</option><option value="100">近100期</option></select></label><input type="search" id="algo-search" placeholder="搜索算法名称" aria-label="搜索算法名称" maxlength="60"><label class="algo-check"><input type="checkbox" id="algo-favorites">我的收藏</label><label class="algo-check" title="开奖更新统计，但保留当前排列；修改筛选条件仍会重新排序"><input type="checkbox" id="algo-lock">锁定排序</label><button id="algo-refresh" class="secondary">刷新</button></div><p id="algo-note" class="algo-note">指标按本地已核验开奖回放；判断仅使用目标期之前的数据，不代表未来收益。</p><p id="algo-message" role="status" aria-live="polite"></p><div id="algo-grid" class="algo-grid"></div><div class="tool-pager algo-pager"><label>每页 <select id="algo-page-size"><option>10</option><option>20</option><option>50</option><option>100</option></select> 条</label><button id="algo-first" class="secondary">首页</button><button id="algo-prev" class="secondary">上一页</button><span id="algo-page"></span><button id="algo-next" class="secondary">下一页</button><button id="algo-last" class="secondary">尾页</button></div></section>
