<section id="algorithm-hall" class="tab"><div class="algo-heading"><div><p>本地算法 · 实际开单胜率与结算收益</p></div><span id="algo-cutoff" class="algo-cutoff">读取本地数据…</span></div><div class="algo-filters"><div class="segmented" id="algo-categories" aria-label="算法分类"><button data-axis="all" class="selected">全部</button><button data-axis="size">大小</button><button data-axis="parity">单双</button></div><label>排序方式<select id="algo-sort"><option value="rate">胜率降序</option><option value="current_hit">当前连中</option><option value="current_miss">当前连挂</option><option value="max_hit">最大连中</option><option value="max_miss">最大连挂</option><option value="favorites">收藏数</option><option value="name">名称</option></select></label><input type="search" id="algo-search" placeholder="搜索算法名称" aria-label="搜索算法名称" maxlength="60"><label class="algo-check"><input type="checkbox" id="algo-favorites">我的收藏</label><label class="algo-check" title="开奖更新统计，但保留当前排列；修改筛选条件仍会重新排序"><input type="checkbox" id="algo-lock">锁定排序</label><button id="algo-refresh" class="secondary">刷新</button></div><div id="algo-window" class="algo-window-row" role="group" aria-label="统计窗口"><span>统计窗口</span><button type="button" class="secondary selected" data-window="20" aria-pressed="true">最近20期</button><button type="button" class="secondary" data-window="100" aria-pressed="false">最近100期</button><button type="button" class="secondary" data-window="500" aria-pressed="false">最近500期</button><button type="button" class="secondary" data-window="1000" aria-pressed="false">最近1000期</button><button type="button" class="secondary" data-window="2000" aria-pressed="false">最近2000期</button><button type="button" class="secondary" data-window="5000" aria-pressed="false">最近5000期</button></div><p id="algo-note" class="algo-note">统计已结算的实时算法跟随订单。</p><p id="algo-message" role="status" aria-live="polite"></p><div id="algo-grid" class="algo-grid"></div><div class="tool-pager algo-pager"><label>每页 <select id="algo-page-size"><option>10</option><option>20</option><option>50</option><option>100</option></select> 条</label><button id="algo-first" class="secondary">首页</button><button id="algo-prev" class="secondary">上一页</button><span id="algo-page"></span><button id="algo-next" class="secondary">下一页</button><button id="algo-last" class="secondary">尾页</button></div></section>
<dialog id="algo-detail-dialog" class="strategy-dialog algo-dialog" aria-labelledby="algo-detail-title"><div class="strategy-dialog-head"><div><span id="algo-detail-category" class="algo-category"></span><h2 id="algo-detail-title">算法详情</h2></div><button id="algo-detail-close" type="button" class="secondary dialog-close" aria-label="关闭算法详情">×</button></div><div class="algo-detail-body"><p id="algo-detail-rule"></p><p class="algo-note">仅显示该算法在开奖前给出同向有效预测、策略实际生成并已结算的模拟订单。同一期多单在胜率中只计一期。</p><div id="algo-detail-metrics" class="algo-detail-metrics"></div><div id="algo-detail-next" class="algo-next"></div><h3>已结算开单明细</h3><p id="algo-detail-message" role="status"></p><div id="algo-detail-table" class="table-wrap"></div><div class="tool-pager"><label>每页 <select id="algo-detail-size"><option>10</option><option selected>20</option><option>50</option><option>100</option></select></label><button id="algo-detail-first" class="secondary">首页</button><button id="algo-detail-prev" class="secondary">上一页</button><span id="algo-detail-page"></span><button id="algo-detail-next-page" class="secondary">下一页</button><button id="algo-detail-last" class="secondary">尾页</button></div></div></dialog>
<dialog id="algo-income-dialog" class="strategy-dialog algo-dialog" aria-labelledby="algo-income-title">
 <div class="strategy-dialog-head"><h2 id="algo-income-title">历史收益 K 线</h2><button id="algo-income-close" type="button" class="secondary dialog-close" aria-label="关闭历史收益">×</button></div>
 <div class="algo-detail-body">
  <p class="algo-note">按实际生成的算法跟随模拟订单的结算时间聚合，使用订单已入账的净盈亏。同一笔跟随订单可能归属多个同向算法，各算法收益不可相加。</p>
  <p id="algo-income-status" role="status"></p>
  <div id="algo-income-chart"></div>
 </div>
</dialog>

<dialog id="algo-backtest-dialog" class="strategy-dialog algo-dialog" aria-labelledby="algo-backtest-title">
 <div class="strategy-dialog-head"><h2 id="algo-backtest-title">算法回测</h2><button id="algo-backtest-close" type="button" class="secondary dialog-close" aria-label="关闭回测">×</button></div>
 <div class="algo-detail-body">
  <form id="algo-backtest-form">
   <div class="algo-window-row" role="group" aria-label="回测预设期数"><button type="button" class="secondary" data-backtest-period="20">最近20期</button><button type="button" class="secondary" data-backtest-period="100">最近100期</button><button type="button" class="secondary" data-backtest-period="500">最近500期</button><button type="button" class="secondary" data-backtest-period="1000">最近1000期</button><button type="button" class="secondary" data-backtest-period="2000">最近2000期</button><button type="button" class="secondary" data-backtest-period="5000">最近5000期</button></div>
   <div class="algo-backtest-controls"><label>回测期数 <input id="algo-backtest-periods" type="number" min="1" max="50000" step="1" required value="20"></label><button id="algo-backtest-run" type="submit">开始回测</button></div>
  </form>
  <p class="algo-note">使用该算法规则和当前赔率逐期回放。初始金额 10,000 U，首单 100 U，赢后恢复 100 U，亏后加 25 U，200 U 的订单亏损后恢复 100 U，退本时金额不变。</p>
  <p id="algo-backtest-status" role="status"></p>
  <div id="algo-backtest-result" hidden>
   <div id="algo-backtest-metrics" class="algo-detail-metrics"></div>
   <div id="algo-backtest-directions" class="table-wrap"></div>
   <div id="algo-backtest-chart"></div>
  </div>
 </div>
</dialog>
