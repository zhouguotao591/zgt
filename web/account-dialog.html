<dialog class="strategy-dialog" id="account-password-dialog"><div class="strategy-dialog-head"><h2>修改密码</h2><button type="button" class="secondary dialog-close" id="account-password-close" aria-label="关闭">×</button></div><form id="account-password-form"><div class="formgrid"><label>原密码<input id="account-old-password" type="password" autocomplete="current-password" maxlength="128" required></label><label>新密码<input id="account-new-password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><label>确认新密码<input id="account-confirm-password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label></div><p class="muted">修改后，当前账号所有登录会话都会退出。</p><p id="account-password-error" class="negative" role="alert"></p><div class="actions"><button id="account-password-save">修改并重新登录</button></div></form></dialog>
