[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pc28-local-research"
version = "1.0.0"
description = "Local Keno ingestion, PC28 conversion and paper-trading research"
requires-python = ">=3.11"
dependencies = ["cryptography>=44", "qrcode[png]>=8.2,<9"]

[project.optional-dependencies]
timezone = ["tzdata>=2025.1"]

[project.scripts]
pc28 = "pc28.__main__:main"

[tool.setuptools]
packages = ["pc28"]
